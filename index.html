<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYAR — Gold Retail Management</title>
<style>
:root{
  --velvet:#16302A; --velvet-deep:#0D1F1A; --velvet-line:#27473F;
  --paper:#F3F6F3; --card:#FFFFFF;
  --gold:#C9A227; --gold-lit:#E8C868; --gold-pale:#FBF4DE;
  --oxblood:#8A2F27; --oxblood-soft:#F6E9E7;
  --slate:#4C5D58; --slate-soft:#8C9B96; --rule:#DCE4E0;
  --ok:#2E6E4E; --ok-soft:#E7F1EB;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --arabic:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:#1B2622;font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{font-family:var(--arabic)}
.num,.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- login ---- */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--velvet);padding:20px}
.gate .box{background:#fff;width:100%;max-width:392px;border-top:3px solid var(--gold)}
.gate .top{padding:26px 28px 20px;text-align:center;border-bottom:1px solid var(--rule)}
.gate h1{font-family:var(--serif);font-size:34px;margin:0;color:var(--velvet);letter-spacing:.2em;font-weight:400}
body[dir="rtl"] .gate h1{font-family:var(--arabic);letter-spacing:0}
.gate .top p{margin:5px 0 0;font-size:12px;color:var(--slate-soft)}
.gate .who{padding:8px 0}
.gate .who button{display:flex;width:100%;gap:11px;align-items:center;background:none;border:0;border-bottom:1px solid #EDF1EE;padding:12px 26px;text-align:start}
.gate .who button:last-child{border-bottom:0}
.gate .who button:hover{background:var(--gold-pale)}
.gate .av{width:32px;height:32px;border-radius:50%;background:var(--velvet);color:var(--gold-lit);display:grid;place-items:center;font-size:12.5px;flex:none}
.gate .nm{font-weight:600;font-size:13.5px}
.gate .rl{font-size:11.5px;color:var(--slate-soft)}
.gate .ft{padding:13px 26px;border-top:1px solid var(--rule);display:flex;gap:7px}
.gate .ft button{flex:1;background:transparent;border:1px solid var(--rule);color:var(--slate);padding:5px 0;font-size:12px}
.gate .ft button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#211A00;font-weight:600}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:214px 1fr;min-height:100vh}
body[dir="rtl"] .shell{grid-template-columns:1fr 214px}
body[dir="rtl"] .rail{order:2}
.rail{background:var(--velvet);color:#D6E2DD;display:flex;flex-direction:column}
.brand{padding:20px 20px 15px;border-bottom:1px solid var(--velvet-line)}
.brand h1{font-family:var(--serif);font-size:25px;margin:0;color:var(--gold-lit);letter-spacing:.18em;font-weight:400}
body[dir="rtl"] .brand h1{font-family:var(--arabic);letter-spacing:0}
.brand p{margin:3px 0 0;font-size:11px;color:#7E948D;line-height:1.35}
.nav{padding:8px 0;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;color:#B9CBC5;text-align:inherit;padding:8px 20px;font-size:13px;border-inline-start:3px solid transparent}
.nav button:hover{background:#1D3A33;color:#EAF2EF}
.nav button[aria-current="true"]{background:var(--velvet-deep);color:#fff;border-inline-start-color:var(--gold)}
.nav .tally{margin-inline-start:auto;font-size:11px;color:var(--gold-lit);font-variant-numeric:tabular-nums}
.nav .tally.warn{color:#E9A19A}
.nav .sep{padding:11px 20px 4px;font-size:10.5px;color:#5E7770;letter-spacing:.06em}
.railfoot{padding:12px 20px 15px;border-top:1px solid var(--velvet-line);font-size:11px;color:#7E948D}
.me{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--velvet-deep);color:var(--gold-lit);display:grid;place-items:center;font-size:11px;flex:none}
.me .nm{color:#DCE7E3;font-size:12.5px;font-weight:600;line-height:1.2}
.me .rl{font-size:10.5px;color:#7E948D}
.langs{display:flex;gap:5px;margin-bottom:9px}
.langs button{flex:1;background:transparent;border:1px solid var(--velvet-line);color:#B9CBC5;padding:4px 0;font-size:11.5px}
.langs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#211A00;font-weight:600}
.railfoot .out{width:100%;background:none;border:0;color:#7E948D;text-align:start;padding:0;font-size:11.5px;text-decoration:underline}
.main{display:flex;flex-direction:column;min-width:0}

/* ---- rate board ---- */
.board{background:var(--velvet-deep);color:#E6EFEC;padding:10px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-bottom:2px solid var(--gold)}
.board .stamp{font-family:var(--serif);font-size:12px;color:#8FA6A0;line-height:1.25;min-width:100px}
body[dir="rtl"] .board .stamp{font-family:var(--arabic)}
.board .stamp b{display:block;color:var(--gold-lit);font-size:12.5px;font-weight:400}
.karats{display:flex;gap:20px;flex-wrap:wrap}
.karat{min-width:84px}
.karat .k{font-size:11px;color:#8FA6A0}
.karat .sell{font-size:20px;color:var(--gold-lit);font-variant-numeric:tabular-nums;line-height:1.15}
.karat .buy{font-size:11px;color:#9FB5AE;font-variant-numeric:tabular-nums}
.karat.flash .sell{animation:tick .9s ease-out}
@keyframes tick{0%{color:#fff;text-shadow:0 0 14px rgba(232,200,104,.9)}100%{color:var(--gold-lit)}}
.board .act{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.board .act button{background:transparent;border:1px solid var(--velvet-line);color:#CBDAD5;padding:5px 11px;font-size:12px}
.board .act button:hover{border-color:var(--gold);color:var(--gold-lit)}
.board .act button:disabled{opacity:.4;cursor:not-allowed}

/* ---- content ---- */
.view{padding:22px 24px 60px;max-width:1200px}
.vhead{margin-bottom:16px}
.vhead h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 3px}
body[dir="rtl"] .vhead h2{font-family:var(--arabic)}
.vhead p{margin:0;color:var(--slate);max-width:68ch;font-size:13.5px}
.panel{background:var(--card);border:1px solid var(--rule);margin-bottom:16px}
.panel>h3{font-size:12.5px;font-weight:600;margin:0;padding:10px 15px;border-bottom:1px solid var(--rule);color:var(--slate);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel>h3 .side{margin-inline-start:auto;font-weight:400;color:var(--slate-soft);font-size:11.5px;display:flex;gap:7px;align-items:center}
.pbody{padding:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1040px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11px;font-weight:600;color:var(--slate-soft);padding:8px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #EDF1EE;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable:hover{background:var(--gold-pale);cursor:pointer}
.r{text-align:end;font-variant-numeric:tabular-nums}
.dim{color:var(--slate-soft)} .tiny{font-size:11.5px}
.pill{display:inline-block;padding:1px 7px;font-size:11px;border:1px solid}
.pill.gold{background:var(--gold-pale);border-color:#E3D094;color:#7A5F09}
.pill.green{background:var(--ok-soft);border-color:#B9D8C6;color:var(--ok)}
.pill.red{background:var(--oxblood-soft);border-color:#E2BEB9;color:var(--oxblood)}
.pill.grey{background:#EEF2F0;border-color:var(--rule);color:var(--slate)}
.metric{padding:2px 0}
.metric .lab{font-size:11.5px;color:var(--slate-soft)}
.metric .val{font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
body[dir="rtl"] .metric .val{font-family:var(--arabic)}
.metric .sub{font-size:11.5px;color:var(--slate)}
.metric .val.pos{color:var(--ok)} .metric .val.neg{color:var(--oxblood)}
.btn{background:var(--velvet);color:#fff;border:1px solid var(--velvet);padding:7px 14px;font-size:13px}
.btn:hover{background:#1E3F37}
.btn.ghost{background:transparent;color:var(--velvet);border-color:var(--rule)}
.btn.ghost:hover{background:#EEF2F0}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1F1800;font-weight:600}
.btn.gold:hover{background:#D9B02C}
.btn.danger{background:var(--oxblood);border-color:var(--oxblood);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11.5px;color:var(--slate);margin-bottom:3px}
label.f input,label.f select,label.f textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);background:#fff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.note{border-inline-start:3px solid var(--gold);background:#FCF8EA;padding:9px 13px;font-size:12.5px;color:#5C4B10}
.note.red{border-inline-start-color:var(--oxblood);background:var(--oxblood-soft);color:#6B241D}
.note.green{border-inline-start-color:var(--ok);background:var(--ok-soft);color:#1F5238}
.formula{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--slate);line-height:1.75}
.formula b{color:#1B2622;font-weight:600}
.meter{height:8px;background:#E7ECE9;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .35s ease,background .35s ease}
.meter i.near{background:var(--gold)} .meter i.over{background:var(--oxblood)}
.stack{display:flex;flex-direction:column;gap:8px}
.rowline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EDF1EE}
.rowline:last-child{border-bottom:0}
.rowline .grow{flex:1;min-width:0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 15px;font-size:13px;color:var(--slate)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--gold);color:#1B2622;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(13,31,26,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal .box{background:#fff;max-width:470px;width:100%;border-top:3px solid var(--gold);max-height:90vh;overflow:auto}
.modal .box.wide{max-width:720px}
.modal h3{margin:0;padding:14px 17px;border-bottom:1px solid var(--rule);font-size:15px;font-family:var(--serif);font-weight:400}
body[dir="rtl"] .modal h3{font-family:var(--arabic)}
.modal .mb{padding:15px 17px} .modal .mf{padding:11px 17px;border-top:1px solid var(--rule);display:flex;gap:7px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--velvet-deep);color:#EAF2EF;padding:10px 17px;border-inline-start:3px solid var(--gold);font-size:13px;z-index:60;max-width:540px}
body[dir="rtl"] .toast{transform:translateX(50%)}
.toast.bad{border-inline-start-color:var(--oxblood)}

/* ---- printable invoice ---- */
.inv{background:#fff;color:#121A17;padding:26px 30px;font-size:12.5px}
.inv .ih{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--velvet);padding-bottom:12px;margin-bottom:14px;gap:18px}
.inv .ih h1{font-family:var(--serif);font-size:30px;margin:0;color:var(--velvet);letter-spacing:.18em;font-weight:400}
body[dir="rtl"] .inv .ih h1{font-family:var(--arabic);letter-spacing:0}
.inv .ih .co{font-size:11px;color:var(--slate);line-height:1.5}
.inv .ih .rt{text-align:end;font-size:11.5px;line-height:1.6}
.inv .ih .rt b{font-size:14px}
.inv .meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;font-size:11.5px}
.inv .meta div span{color:var(--slate-soft)}
.inv table{margin-bottom:12px}
.inv th{font-size:10.5px;border-bottom:1px solid var(--velvet)}
.inv td{border-bottom:1px solid #E9EEEB;font-size:11.5px}
.inv .tot{margin-inline-start:auto;width:290px;font-size:12px}
.inv .tot .l{display:flex;justify-content:space-between;padding:3px 0}
.inv .tot .l.big{border-top:2px solid var(--velvet);margin-top:5px;padding-top:7px;font-size:15px;font-weight:600}
.inv .decl{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;font-size:10.5px;color:var(--slate);line-height:1.6}
.inv .sig{display:flex;justify-content:space-between;margin-top:26px;font-size:11px;color:var(--slate-soft)}
.inv .sig div{border-top:1px solid var(--rule);padding-top:5px;width:170px;text-align:center}
@media print{
  body{background:#fff}
  .rail,.board,.vhead,.tabs,.modal .mf,.noprint{display:none!important}
  .modal{position:static;background:none;padding:0;display:block}
  .modal .box,.modal .box.wide{max-width:none;border:0;box-shadow:none;max-height:none;overflow:visible}
  .modal h3{display:none}
  .modal .mb{padding:0}
  .shell{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){
  .shell,body[dir="rtl"] .shell{grid-template-columns:1fr}
  .rail{order:0}
  .nav{display:flex;overflow-x:auto;padding:0}
  .nav button{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent}
  .nav button[aria-current="true"]{border-inline-start:0;border-bottom-color:var(--gold)}
  .nav .tally,.nav .sep,.railfoot{display:none}
  .view{padding:16px 12px 50px}
}
</style>
</head>

/* Three ways a Qatari shop sets its board:
     official  — take the local market/association rate for the reference karat, derive the rest
     benchmark — derive from the global spot price and the USD/QAR rate
     fixed     — the owner keys 24K directly
   All three produce the same shape; only the base differs. */
function ratesFrom24(base24, spreadPct){
  const out = {};
  for (const k of [24,22,21,18]){
    const sell = base24*PURITY[k];
    out[k] = {sell:round2(sell), buy:round2(sell*(1-spreadPct/100))};
  }
  return out;
}
function computeRates(spot, fx, spreadPct){
  return ratesFrom24((spot/31.1034768)*fx, spreadPct);
}
function ratesFromReference(refRate, refKarat, spreadPct){
  return ratesFrom24(refRate/PURITY[refKarat], spreadPct);
}
function newBill(){
  return {lines:[], oldGold:[], customer:"", discPct:0, discApprovedBy:"",
          tender:{cash:0,card:0,transfer:0},
          lockedRates:JSON.parse(JSON.stringify(S.rates)), lockedAt:S.ratesSetAt};
}
S.rates = computeRates(S.spot, S.fx, S.spreadPct);
S.bill = newBill();

/* ---------------- engine ---------------- */
const netOf   = it => round3(it.gross - it.stone);
const fine    = (net,k) => net*PURITY[k];
function makingCharge(it, goldValue){
  if (it.mk==="g") return netOf(it)*it.mkv;
  if (it.mk==="p") return it.mkv;
  return goldValue*it.mkv/100;
}
function priceLine(it, rates){
  const net = netOf(it), rate = rates[it.k].sell;
  const goldValue = net*rate;
  const making = makingCharge(it, goldValue);
  const stones = it.stoneVal||0;
  return {net, rate, goldValue, making, stones, total:goldValue+making+stones};
}
function billTotals(b){
  let gold=0, making=0, stones=0;
  b.lines.forEach(tag=>{
    const it = STOCK.find(s=>s.tag===tag); if(!it) return;
    const p = priceLine(it, b.lockedRates);
    gold+=p.goldValue; making+=p.making; stones+=p.stones;
  });
  const discount = making*(b.discPct||0)/100;          // discount applies to making only
  const oldGoldCredit = b.oldGold.reduce((a,o)=>a+o.credit,0);
  const sub = gold + making - discount + stones;
  return {gold, making, stones, discount, sub, oldGoldCredit, net:Math.max(0, sub-oldGoldCredit)};
}
function metalNet(m, bid){ return m.owned + m.scrap + m.atKarigar - m.owed - (bid?schemeFineByBranch(bid):0) }
function metalTotals(){
  const t = Object.entries(METAL).reduce((a,[bid,m])=>({
    owned:a.owned+m.owned, consigned:a.consigned+m.consigned, scrap:a.scrap+m.scrap,
    owed:a.owed+m.owed, atKarigar:a.atKarigar+m.atKarigar, scheme:a.scheme+schemeFineByBranch(bid)
  }),{owned:0,consigned:0,scrap:0,owed:0,atKarigar:0,scheme:0});
  t.net = t.owned + t.scrap + t.atKarigar - t.owed - t.scheme;
  return t;
}

/* ---- buy-back against an original sale ----
   Base metal value only. Making charges and design premium are never refunded. */
function findOriginalSale(tag){
  for (const s of SALES){
    if (s.void) continue;
    if ((s.lines||[]).some(l=>l.tag===tag)) return s;
  }
  return null;
}
function buyBackQuote(tag, rates){
  const it = STOCK.find(x=>x.tag===tag);
  if (!it) return null;
  const sale = findOriginalSale(tag);
  const net = netOf(it);
  const back = net * rates[it.k].buy;
  const paidAt = sale ? priceLine(it, sale.rates||rates) : null;
  return {
    item:it, sale, net, karat:it.k, back:round2(back),
    paidGold: paidAt ? round2(paidAt.goldValue) : null,
    paidMaking: paidAt ? round2(paidAt.making) : null,
    paidStones: paidAt ? round2(paidAt.stones) : null,
    paidTotal: paidAt ? round2(paidAt.total) : null,
    notRefunded: paidAt ? round2(paidAt.making + paidAt.stones) : null,
  };
}
function jobVariance(j){
  if (j.status!=="done") return null;
  const shortfall = j.issued - j.received;
  const allowed = j.issued*j.tol/100;
  return {shortfall, allowed, breach: shortfall > allowed + 1e-9};
}
function nextInvoiceNo(branch){
  const code = BRANCHES.find(b=>b.id===branch).code;
  const seq = SALES.filter(s=>s.branch===branch).length + 1;
  return code + "-26-" + String(1187+seq).padStart(5,"0");
}
function log(act, detail){
  const d = new Date();
  AUDIT.unshift({t:TODAY+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),
                 user:S.user, act, detail});
}
/* ---- savings scheme engine ---- */
const planOf = e => PLANS.find(p=>p.id===e.plan);
function effectiveRate(e, marketRate){
  const pl = planOf(e);
  if (pl.prot==="enrol")  return e.protRate || marketRate;
  if (pl.prot==="lowest") return Math.min(e.protRate || marketRate, marketRate);
  return marketRate;
}
function schemeState(e){
  const pl = planOf(e);
  const cash = e.payments.reduce((a,x)=>a+x.amount,0);
  const grams = e.payments.reduce((a,x)=>a+x.amount/x.rate,0);         // grams at the plan karat
  const bonusGrams = pl.bonusMonths && e.payments.length>=pl.months
    ? (e.monthly/(e.protRate || e.payments[e.payments.length-1].rate))*pl.bonusMonths : 0;
  const totalGrams = grams + bonusGrams;
  const fineGrams = totalGrams*PURITY[pl.k];
  const marketRate = S.rates[pl.k].sell;
  const valueToday = totalGrams*marketRate;
  return {cash, grams, bonusGrams, totalGrams, fineGrams, marketRate,
          valueToday, exposure: valueToday - cash,
          avgRate: grams>0 ? cash/grams : 0,
          paid: e.payments.length, due: pl.months,
          complete: e.payments.length>=pl.months};
}
function schemeTotals(){
  return ENROLMENTS.filter(e=>e.status!=="redeemed").reduce((a,e)=>{
    const st = schemeState(e);
    return {cash:a.cash+st.cash, grams:a.grams+st.totalGrams, fine:a.fine+st.fineGrams,
            value:a.value+st.valueToday, exposure:a.exposure+st.exposure, n:a.n+1};
  }, {cash:0, grams:0, fine:0, value:0, exposure:0, n:0});
}
function schemeFineByBranch(bid){
  return ENROLMENTS.filter(e=>e.status!=="redeemed"&&e.branch===bid)
    .reduce((a,e)=>a+schemeState(e).fineGrams, 0);
}

/* ---------------- format helpers ---------------- */
const t  = () => T[S.lang];
const loc = () => S.lang==="ar" ? "ar-QA" : "en-QA";
const g  = n => Number(n).toLocaleString(loc(),{minimumFractionDigits:3,maximumFractionDigits:3});
const q  = n => Number(n).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
const q0 = n => Number(n).toLocaleString(loc(),{maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm = o => o ? (S.lang==="ar"?o.ar:o.en) : "";
const branchName = id => nm(BRANCHES.find(b=>b.id===id)) || id;
const custName   = id => nm(CUSTOMERS.find(c=>c.id===id)) || t().walkIn;
const userName   = id => nm(USERS.find(u=>u.id===id)) || id;
const supName    = id => nm(SUPPLIERS.find(s=>s.id===id)) || id;
const karName    = id => nm(KARIGARS.find(k=>k.id===id)) || id;
const roleName   = r => ({owner:t().roleOwner, manager:t().roleManager, sales:t().roleSales}[r]);
const kLabel     = k => S.lang==="ar" ? "عيار "+k : k+"K";
const gUnit      = () => S.lang==="ar" ? "جم" : "g";

function toast(msg, bad){
  const h = document.getElementById("toastHost");
  h.innerHTML = '<div class="toast'+(bad?" bad":"")+'">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{h.innerHTML="";}, 3400);
}
function closeModal(){ document.getElementById("modalHost").innerHTML=""; }
function makingLabel(it){
  if (it.mk==="g") return q(it.mkv)+" / "+gUnit();
  if (it.mk==="p") return q(it.mkv)+" "+t().perPiece;
  return it.mkv+" "+t().pctOfGold;
}
const actLabel = a => ({rate:t().actRate, discount:t().actDiscount, cdd:t().actCdd, close:t().actClose,
  void:t().actVoid, sale:t().actSale, transfer:t().actTransfer, job:t().actJob,
  purchase:t().actPurchase, scheme:t().nav.schemes}[a]||a);
const alertTitle = a => ({structuring:t().alertStructuring, pep:t().alertPep, highvalue:t().alertHighValue}[a.type]);
const alertBody  = a => ({structuring:t().alertStructuringBody, pep:t().alertPepBody, highvalue:t().alertHighValueBody}[a.type]);

/* ---------------- login ---------------- */
function viewLogin(){
  const L = t();
  return `<div class="gate"><div class="box">
    <div class="top"><h1>${esc(L.brand)}</h1><p>${L.brandSub.replace("<br>"," · ")}</p></div>
    <div class="who">
      ${USERS.map(u=>`<button onclick="signIn('${u.id}')">
        <span class="av">${esc(u.init)}</span>
        <span><span class="nm">${esc(nm(u))}</span><br>
        <span class="rl">${esc(roleName(u.role))} · ${esc(branchName(u.branch))}</span></span>
      </button>`).join("")}
    </div>
    <div class="ft">
      <button onclick="setLang('en')" aria-pressed="${S.lang==="en"}">English</button>
      <button onclick="setLang('ar')" aria-pressed="${S.lang==="ar"}">العربية</button>
    </div>
  </div></div>`;
}
function signIn(id){
  S.user = id;
  const u = USERS.find(x=>x.id===id);
  if (ROLES[u.role].branchLock) S.branch = u.branch;
  S.view = "board"; S.bill = newBill();
  renderAll();
}
function signOut(){ S.user=null; S.view="board"; renderAll(); }

/* ---------------- rate board ---------------- */
function renderBoard(flash){
  const L = t();
  const karats = [24,22,21,18].map(k=>`
    <div class="karat${flash?" flash":""}">
      <div class="k">${esc(kLabel(k))} · ${(PURITY[k]*1000).toFixed(0)}</div>
      <div class="sell">${q(S.rates[k].sell)}</div>
      <div class="buy">${esc(L.buy)} ${q(S.rates[k].buy)}</div>
    </div>`).join("");
  return `<div class="board" id="board">

function ratesFromForm(){
  const src=document.getElementById("rSrc").value;
  const sd=parseFloat(document.getElementById("rSpread").value)||0;
  if (src==="benchmark"){
    return computeRates(parseFloat(document.getElementById("rSpot").value)||0,
                        parseFloat(document.getElementById("rFx").value)||0, sd);
  }
  if (src==="official"){
    return ratesFromReference(parseFloat(document.getElementById("rRef").value)||0,
                              parseInt(document.getElementById("rRefK").value,10), sd);
  }
  return ratesFrom24(parseFloat(document.getElementById("rFix").value)||0, sd);
}
function previewRates(){
  const r=ratesFromForm();
  document.getElementById("ratePreview").innerHTML=[24,22,21,18].map(k=>
    `${esc(kLabel(k))} &nbsp; <b>${q(r[k].sell)}</b> &nbsp;<span class="dim">${esc(t().buy)} ${q(r[k].buy)}</span>`).join("<br>");
}
function srcLabel(s){ return {official:t().srcOfficial, benchmark:t().srcBenchmark, fixed:t().srcFixed}[s]||s }
function publishRates(){
  const old24=S.rates[24].sell, src=document.getElementById("rSrc").value;
  S.spreadPct=parseFloat(document.getElementById("rSpread").value)||S.spreadPct;
  if (src==="benchmark"){
    S.spot=parseFloat(document.getElementById("rSpot").value)||S.spot;
    S.fx=parseFloat(document.getElementById("rFx").value)||S.fx;
  } else if (src==="official"){
    S.refRate=parseFloat(document.getElementById("rRef").value)||S.refRate;
  }
  S.rates=ratesFromForm(); S.rateSource=src; S.rateBy=S.user;
  const d=new Date();
  S.ratesSetAt=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  log("rate", kLabel(24)+" "+q(old24)+" → "+q(S.rates[24].sell)+" · "+srcLabel(src));
  closeModal(); renderAll(true); toast(t().ratesPublished);
}

function finishSale(withCdd){
  const b=S.bill, bt=billTotals(b), no=nextInvoiceNo(S.branch);
  SALES.unshift({no, date:TODAY, branch:S.branch, cust:b.customer, by:S.user,
    gold:bt.gold, making:bt.making-bt.discount, stones:bt.stones, oldGold:bt.oldGoldCredit,
    net:bt.net, cash:b.tender.cash, card:b.tender.card, transfer:b.tender.transfer,
    cdd:!!withCdd, lines:b.lines.map(tag=>({tag})), oldGoldRows:b.oldGold.slice(), void:false,
    rates:JSON.parse(JSON.stringify(b.lockedRates))});
  b.lines.forEach(tag=>{
    const it=STOCK.find(s=>s.tag===tag); if(!it) return;
    it.status="sold"; METAL[it.branch].owned-=fine(netOf(it),it.k);
  });
  b.oldGold.forEach((o,i)=>{
    STOCK.push({tag:"SC-"+(9200+STOCK.length+i), en:"Scrap lot", ar:"دفعة كسر", k:o.k, gross:o.wt, stone:0,

  log("sale", no+" · QAR "+q(bt.net));
  clearBill();
  toast(withCdd?t().saleDoneAml:t().saleDone);
}

  it.branch=to; renderAll(); toast(t().transferred+" → "+branchName(to));
}

    <div class="panel"><div class="pbody"><div class="metric"><div class="lab">${esc(L.invoices)}</div>
      <div class="val">${q0(d.inv+todays.length)}</div><div class="sub">${esc(branchName(b))}</div></div></div></div>
  </div>
  <div class="panel"><h3>${esc(L.closeDay)} — ${esc(branchName(b))} · ${esc(TODAY)}</h3><div class="pbody">
    ${closed?`<div class="note green"><b>${esc(L.closedOk)}</b> · ${esc(L.closedBy)} ${esc(userName(closed.by))}<br>
      ${esc(L.varianceCash)} ${q(closed.variance)}</div>`
    :`<div class="grid2">
      <div>
        <label class="f"><span>${esc(L.countedCash)} (QAR)</span>
          <input class="num" type="number" step="0.01" value="${esc(S.countedCash)}" data-fk="cc"
            oninput="S.countedCash=this.value;renderView();focusBack('cc')" placeholder="${q0(cash)}"></label>
        <button class="btn gold" onclick="closeDay(${cash})" ${S.countedCash===""?"disabled":""}>${esc(L.closeDay)}</button>
        ${S.countedCash===""?`<div class="tiny dim" style="margin-top:6px">${esc(L.enterCount)}</div>`:""}
      </div>
      <div>
        <div class="formula">
          <div>${esc(L.expectedCash)} <b style="float:inline-end">${q(cash)}</b></div>
          <div>${esc(L.countedCash)} <b style="float:inline-end">${q(counted)}</b></div>
          <div style="border-top:2px solid var(--velvet);margin-top:6px;padding-top:6px">
            ${esc(L.overShort)} <b style="float:inline-end;color:${Math.abs(variance)<0.01?"var(--ok)":"var(--oxblood)"}">
            ${variance>=0?"+":"−"}${q(Math.abs(variance))}</b></div>
        </div>
        ${S.countedCash!==""&&Math.abs(variance)<0.01?`<div class="note green" style="margin-top:9px">${esc(L.noVarianceOk)}</div>`:""}
        ${S.countedCash!==""&&Math.abs(variance)>=0.01?`<div class="note red" style="margin-top:9px">${esc(L.varianceFlag)}</div>`:""}
      </div>
    </div>`}
  </div></div>
  ${CLOSES.length?`<div class="panel"><h3>${esc(L.nav.dayclose)}</h3><div class="pbody" style="padding:0"><table>
    <thead><tr><th>${esc(L.date)}</th><th>${esc(L.branch)}</th><th class="r">${esc(L.expectedCash)}</th>
      <th class="r">${esc(L.countedCash)}</th><th class="r">${esc(L.varianceCash)}</th><th>${esc(L.closedBy)}</th></tr></thead>
    <tbody>${CLOSES.map(c=>`<tr><td class="mono tiny">${esc(c.date)}</td><td>${esc(branchName(c.branch))}</td>
      <td class="r mono">${q(c.expected)}</td><td class="r mono">${q(c.counted)}</td>
      <td class="r mono" style="color:${Math.abs(c.variance)<0.01?"var(--ok)":"var(--oxblood)"}">${c.variance>=0?"+":"−"}${q(Math.abs(c.variance))}</td>
      <td class="tiny dim">${esc(userName(c.by))}</td></tr>`).join("")}</tbody></table></div></div>`:""}`;
}
function closeDay(expected){
  const counted=parseFloat(S.countedCash)||0, variance=round2(counted-expected);
  CLOSES.unshift({date:TODAY, branch:S.branch, expected, counted, variance, by:S.user});
  log("close", branchName(S.branch)+" · "+(variance>=0?"+":"")+q(variance));
  S.countedCash=""; renderAll();
  toast(t().closedOk+(Math.abs(variance)>=0.01?" · "+t().varianceCash+" "+q(variance):""), Math.abs(variance)>=0.01);
}

/* ================= compliance ================= */
function viewCompliance(){
  const L=t(), tab=S.tab.comp||"alerts", openN=ALERTS.filter(a=>a.status==="open").length;
  let body="";
  if (tab==="alerts"){
    body=`<div class="pbody" style="padding:0;overflow-x:auto"><table>
      <thead><tr><th>${esc(L.date)}</th><th>${esc(L.alerts)}</th><th>${esc(L.customerCol)}</th>
        <th class="r">${esc(L.amountCol)}</th><th>${esc(L.statusCol)}</th><th></th></tr></thead>
      <tbody>${ALERTS.map(a=>`<tr><td class="mono tiny">${esc(a.date)}</td>
        <td><b>${esc(alertTitle(a))}</b><div class="tiny dim">${esc(alertBody(a))}</div></td>
        <td>${esc(custName(a.cust))}</td><td class="r mono">${a.amount?q0(a.amount):"—"}</td>
        <td>${a.status==="open"?`<span class="pill red">${esc(L.open)}</span>`:`<span class="pill green">${esc(L.cleared)}</span>`}</td>
        <td class="r">${a.status==="open"?`<button class="btn ghost sm" onclick="escalate('${a.id}')">${esc(L.escalate)}</button>`:""}</td>
      </tr>`).join("")}</tbody></table></div>`;
  } else if (tab==="cdd"){
    body=`<div class="pbody" style="padding:0;overflow-x:auto"><table>
      <thead><tr><th>${esc(L.date)}</th><th>${esc(L.customerCol)}</th><th>${esc(L.idType)}</th>
        <th>${esc(L.idNumber)}</th><th>${esc(L.expiry)}</th><th>${esc(L.recordedBy)}</th></tr></thead>
      <tbody>${CDD.map(c=>`<tr><td class="mono tiny">${esc(c.date)}</td><td>${esc(c.custName||custName(c.cust))}</td>
        <td>${esc({qid:L.qid,passport:L.passport,cr:L.cr}[c.idType]||c.idType)}</td>
        <td class="mono tiny">${esc(c.num)}</td><td class="mono tiny">${esc(c.expiry)}</td>
        <td class="tiny dim">${esc(userName(c.by))}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    body=`<div class="pbody" style="padding:0;overflow-x:auto"><table>
      <thead><tr><th>${esc(L.when)}</th><th>${esc(L.who)}</th><th>${esc(L.action)}</th><th>${esc(L.detail)}</th></tr></thead>
      <tbody>${AUDIT.map(a=>`<tr><td class="mono tiny">${esc(a.t)}</td><td>${esc(userName(a.user))}</td>
        <td><span class="pill grey">${esc(actLabel(a.act))}</span></td><td class="tiny">${esc(a.detail)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `<div class="vhead"><h2>${esc(L.v_comp_h)}</h2><p>${esc(L.v_comp_p)}</p></div>
  <div class="grid3">
    <div class="panel"><div class="pbody"><div class="metric"><div class="lab">${esc(L.cddRecords)}</div>
      <div class="val">${q0(CDD.length)}</div><div class="sub">QAR ${q0(AML_CASH_THRESHOLD)}</div></div></div></div>
    <div class="panel"><div class="pbody"><div class="metric"><div class="lab">${esc(L.alerts)}</div>
      <div class="val ${openN?"neg":"pos"}">${q0(openN)}</div><div class="sub">${esc(L.open)}</div></div></div></div>
    <div class="panel"><div class="pbody"><div class="metric"><div class="lab">${esc(L.retention)}</div>
      <div class="val">${q0(RETENTION_YEARS)}</div><div class="sub">${esc(L.retentionSub)}</div></div></div></div>
  </div>
  <div class="tabs">
    <button onclick="setTab('comp','alerts')" aria-selected="${tab==="alerts"}">${esc(L.tabAlerts)}</button>
    <button onclick="setTab('comp','cdd')" aria-selected="${tab==="cdd"}">${esc(L.tabCdd)}</button>
    <button onclick="setTab('comp','audit')" aria-selected="${tab==="audit"}">${esc(L.tabAudit)}</button>
  </div>
  <div class="panel">${body}</div>`;
}
function setTab(k,v){ S.tab[k]=v; renderView(); }
function escalate(id){
  const a=ALERTS.find(x=>x.id===id); if(!a) return;
  a.status="cleared"; log("void","MLRO · "+alertTitle(a));
  renderAll(); toast(t().escalated);
}

/* ================= render ================= */
function renderView(){
  const host=document.getElementById("viewHost"); if(!host) return;
  host.innerHTML =
      S.view==="counter"    ? viewCounter()
    : S.view==="register"   ? viewRegister()
    : S.view==="stock"      ? viewStock()
    : S.view==="schemes"    ? viewSchemes()
    : S.view==="workshop"   ? viewWorkshop()
    : S.view==="purchases"  ? viewPurchases()
    : S.view==="metal"      ? viewMetal()
    : S.view==="dayclose"   ? viewDayClose()
    : S.view==="compliance" ? viewCompliance()
    : viewBoard();
  if(_fk){
    const el=host.querySelector('[data-fk="'+_fk+'"]');
    if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; }
    _fk=null;
  }
}
function renderAll(flash){
  const L=t(), u=me();
  if(!S.user){ document.getElementById("app").innerHTML=viewLogin(); return; }
  document.getElementById("app").innerHTML=`<div class="shell">
    <aside class="rail">
      <div class="brand"><h1>${esc(L.brand)}</h1><p>${L.brandSub}</p></div>
      <nav class="nav">${renderNav()}</nav>
      <div class="railfoot">
        <div class="me"><span class="av">${esc(u.init)}</span>
          <span><span class="nm">${esc(nm(u))}</span><br><span class="rl">${esc(roleName(u.role))} · ${esc(branchName(S.branch))}</span></span></div>
        <div class="langs">
          <button onclick="setLang('en')" aria-pressed="${S.lang==="en"}">English</button>
          <button onclick="setLang('ar')" aria-pressed="${S.lang==="ar"}">العربية</button></div>
        <button class="out" onclick="signOut()">${esc(L.signOut)}</button>
        <div style="margin-top:6px">${esc(L.demoNote)}</div>
      </div>
    </aside>
    <div class="main">${renderBoard(flash)}<div class="view" id="viewHost"></div></div>
  </div>`;
  renderView();
}

/* ================= boot ================= */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get("lang")==="ar") S.lang="ar";
  const views=["board","counter","register","stock","schemes","workshop","purchases","metal","dayclose","compliance"];
  if(views.includes(p.get("view"))) S.view=p.get("view");
  if(BRANCHES.some(b=>b.id===p.get("branch"))) S.branch=p.get("branch");
  if(USERS.some(u=>u.id===p.get("as"))) signIn(p.get("as"));
  document.documentElement.lang=S.lang;
  document.documentElement.dir=T[S.lang].dir;
  document.body.dir=T[S.lang].dir;
  renderAll();
})();

</script>
</body>
</html>
