<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYAR — Gold Retail Management</title>
<style>
:root{
  --velvet:#16302A;
  --velvet-deep:#0D1F1A;
  --velvet-line:#27473F;
  --paper:#F3F6F3;
  --card:#FFFFFF;
  --gold:#C9A227;
  --gold-lit:#E8C868;
  --oxblood:#8A2F27;
  --oxblood-soft:#F6E9E7;
  --slate:#4C5D58;
  --slate-soft:#8C9B96;
  --rule:#DCE4E0;
  --ok:#2E6E4E;
  --ok-soft:#E7F1EB;

  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --arabic:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:#1B2622;
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body[dir="rtl"]{font-family:var(--arabic)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
body[dir="rtl"] .shell{grid-template-columns:1fr 216px}
body[dir="rtl"] .rail{order:2}

.rail{background:var(--velvet);color:#D6E2DD;display:flex;flex-direction:column}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--velvet-line)}
.brand h1{
  font-family:var(--serif);font-size:27px;margin:0;color:var(--gold-lit);
  letter-spacing:.18em;font-weight:400;
}
body[dir="rtl"] .brand h1{font-family:var(--arabic);letter-spacing:0}
.brand p{margin:4px 0 0;font-size:11.5px;color:#7E948D;line-height:1.35}

.nav{padding:10px 0;flex:1}
.nav button{
  display:flex;align-items:baseline;gap:9px;width:100%;
  background:none;border:0;color:#B9CBC5;text-align:inherit;
  padding:9px 20px;font-size:13.5px;border-inline-start:3px solid transparent;
}
.nav button:hover{background:#1D3A33;color:#EAF2EF}
.nav button[aria-current="true"]{
  background:var(--velvet-deep);color:#fff;border-inline-start-color:var(--gold);
}
.nav .tally{margin-inline-start:auto;font-size:11px;color:var(--gold-lit);font-variant-numeric:tabular-nums}
.nav .tally.warn{color:#E9A19A}

.railfoot{padding:14px 20px 18px;border-top:1px solid var(--velvet-line);font-size:11.5px;color:#7E948D}
.langs{display:flex;gap:6px;margin-bottom:10px}
.langs button{
  flex:1;background:transparent;border:1px solid var(--velvet-line);color:#B9CBC5;
  padding:5px 0;font-size:12px;border-radius:2px;
}
.langs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#211A00;font-weight:600}

.main{display:flex;flex-direction:column;min-width:0}

/* ---------- rate board (persistent) ---------- */
.board{
  background:var(--velvet-deep);color:#E6EFEC;
  padding:11px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  border-bottom:2px solid var(--gold);
}
.board .stamp{font-family:var(--serif);font-size:12.5px;color:#8FA6A0;line-height:1.25;min-width:104px}
body[dir="rtl"] .board .stamp{font-family:var(--arabic)}
.board .stamp b{display:block;color:var(--gold-lit);font-size:13px;font-weight:400}
.karats{display:flex;gap:22px;flex-wrap:wrap}
.karat{min-width:88px}
.karat .k{font-size:11.5px;color:#8FA6A0}
.karat .sell{font-size:21px;color:var(--gold-lit);font-variant-numeric:tabular-nums;line-height:1.15}
.karat .buy{font-size:11.5px;color:#9FB5AE;font-variant-numeric:tabular-nums}
.karat.flash .sell{animation:tick .9s ease-out}
@keyframes tick{0%{color:#fff;text-shadow:0 0 14px rgba(232,200,104,.9)}100%{color:var(--gold-lit)}}
.board .act{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.board .act button{
  background:transparent;border:1px solid var(--velvet-line);color:#CBDAD5;
  padding:6px 12px;border-radius:2px;font-size:12.5px;
}
.board .act button:hover{border-color:var(--gold);color:var(--gold-lit)}

/* ---------- content ---------- */
.view{padding:24px 26px 60px;max-width:1180px}
.vhead{margin-bottom:18px}
.vhead h2{font-family:var(--serif);font-weight:400;font-size:25px;margin:0 0 3px}
body[dir="rtl"] .vhead h2{font-family:var(--arabic)}
.vhead p{margin:0;color:var(--slate);max-width:66ch;font-size:13.5px}

.panel{background:var(--card);border:1px solid var(--rule);margin-bottom:18px}
.panel > h3{
  font-size:13px;font-weight:600;margin:0;padding:11px 16px;
  border-bottom:1px solid var(--rule);color:var(--slate);
  display:flex;align-items:center;gap:10px;
}
.panel > h3 .side{margin-inline-start:auto;font-weight:400;color:var(--slate-soft);font-size:12px}
.pbody{padding:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse}
th{
  text-align:start;font-size:11.5px;font-weight:600;color:var(--slate-soft);
  padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid #EDF1EE;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.r{text-align:end;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--slate-soft)}
.tiny{font-size:11.5px}

.pill{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;border:1px solid}
.pill.gold{background:#FBF4DE;border-color:#E3D094;color:#7A5F09}
.pill.green{background:var(--ok-soft);border-color:#B9D8C6;color:var(--ok)}
.pill.red{background:var(--oxblood-soft);border-color:#E2BEB9;color:var(--oxblood)}
.pill.grey{background:#EEF2F0;border-color:var(--rule);color:var(--slate)}

.metric{padding:2px 0}
.metric .lab{font-size:11.5px;color:var(--slate-soft)}
.metric .val{font-family:var(--serif);font-size:27px;font-variant-numeric:tabular-nums;line-height:1.2}
body[dir="rtl"] .metric .val{font-family:var(--arabic)}
.metric .sub{font-size:11.5px;color:var(--slate)}
.metric .val.pos{color:var(--ok)} .metric .val.neg{color:var(--oxblood)}

.btn{background:var(--velvet);color:#fff;border:1px solid var(--velvet);padding:8px 15px;border-radius:2px;font-size:13px}
.btn:hover{background:#1E3F37}
.btn.ghost{background:transparent;color:var(--velvet);border-color:var(--rule)}
.btn.ghost:hover{background:#EEF2F0}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1F1800;font-weight:600}
.btn.gold:hover{background:#D9B02C}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px}

label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:11.5px;color:var(--slate);margin-bottom:3px}
label.f input,label.f select{
  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:2px;background:#fff;
}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.note{border-inline-start:3px solid var(--gold);background:#FCF8EA;padding:10px 14px;font-size:12.5px;color:#5C4B10}
.note.red{border-inline-start-color:var(--oxblood);background:var(--oxblood-soft);color:#6B241D}
.note.green{border-inline-start-color:var(--ok);background:var(--ok-soft);color:#1F5238}

/* formula receipt */
.formula{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--slate);line-height:1.75}
.formula b{color:#1B2622;font-weight:600}

/* AML meter */
.meter{height:9px;background:#E7ECE9;border-radius:1px;overflow:hidden;margin:7px 0 5px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .35s ease,background .35s ease}
.meter i.near{background:var(--gold)}
.meter i.over{background:var(--oxblood)}

.stack{display:flex;flex-direction:column;gap:9px}
.rowline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EDF1EE}
.rowline:last-child{border-bottom:0}
.rowline .grow{flex:1;min-width:0}

.modal{position:fixed;inset:0;background:rgba(13,31,26,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:#fff;max-width:460px;width:100%;border-top:3px solid var(--gold);max-height:88vh;overflow:auto}
.modal h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--rule);font-size:15px;font-family:var(--serif);font-weight:400}
body[dir="rtl"] .modal h3{font-family:var(--arabic)}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}

.toast{
  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--velvet-deep);color:#EAF2EF;padding:11px 18px;border-radius:2px;
  border-inline-start:3px solid var(--gold);font-size:13px;z-index:60;max-width:520px;
}
body[dir="rtl"] .toast{transform:translateX(50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  body[dir="rtl"] .shell{grid-template-columns:1fr}
  .rail{order:0}
  .nav{display:flex;overflow-x:auto;padding:0}
  .nav button{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent}
  .nav button[aria-current="true"]{border-inline-start:0;border-bottom-color:var(--gold)}
  .nav .tally{display:none}
  .railfoot{display:none}
  .view{padding:18px 14px 50px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <h1 id="brandName">AYAR</h1>

    <div class="railfoot">
      <div class="langs">
        <button id="langEn" onclick="setLang('en')" aria-pressed="true">English</button>
        <button id="langAr" onclick="setLang('ar')" aria-pressed="false">العربية</button>
      </div>
      <div id="railNote">Demonstration data</div>
    </div>
  </aside>

  <div class="main">
    <div class="board" id="board"></div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>

function computeRates(spot, fx, spreadPct){
  const perGram24 = (spot / 31.1034768) * fx;
  const out = {};
  for (const k of [24,22,21,18]){
    const sell = perGram24 * KARAT_PURITY[k];
    out[k] = { sell: round2(sell), buy: round2(sell * (1 - spreadPct/100)) };
  }
  return out;
}

/* ---------------- helpers ---------------- */
const t = () => T[S.lang];
function round2(n){ return Math.round(n*100)/100; }
function round3(n){ return Math.round(n*1000)/1000; }
const g  = n => Number(n).toLocaleString(S.lang==="ar"?"ar-QA":"en-QA",{minimumFractionDigits:3,maximumFractionDigits:3});
const q  = n => Number(n).toLocaleString(S.lang==="ar"?"ar-QA":"en-QA",{minimumFractionDigits:2,maximumFractionDigits:2});
const q0 = n => Number(n).toLocaleString(S.lang==="ar"?"ar-QA":"en-QA",{maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf = o => S.lang==="ar" ? o.ar : o.en;
const branchName = id => { const b = BRANCHES.find(x=>x.id===id); return b ? nameOf(b) : id; };
const custName = id => { const c = CUSTOMERS.find(x=>x.id===id); return c ? nameOf(c) : t().walkIn; };
const fine = (net, k) => net * KARAT_PURITY[k];
const netOf = it => round3(it.gross - it.stone);

function makingCharge(it, goldValue){
  if (it.mk === "g")   return netOf(it) * it.mkv;
  if (it.mk === "p")   return it.mkv;
  return goldValue * it.mkv / 100;
}
function makingLabel(it){
  if (it.mk === "g")   return q(it.mkv) + " / " + (S.lang==="ar"?"جم":"g");
  if (it.mk === "p")   return q(it.mkv) + " " + t().perPiece;
  return it.mkv + " " + t().pctOfGold;
}
function priceLine(it, rates){
  const net = netOf(it);
  const rate = rates[it.k].sell;
  const goldValue = net * rate;
  const mk = makingCharge(it, goldValue);
  return { net, rate, goldValue, making:mk, stones:it.stoneVal||0, total: goldValue + mk + (it.stoneVal||0) };
}

  const rates = S.bill.lockedRates;
  let gold=0, making=0, stones=0;
  S.bill.lines.forEach(tag=>{

  const oldGoldCredit = S.bill.oldGold.reduce((a,o)=>a+o.credit,0);
  const sub = gold + making + stones;
  return { gold, making, stones, sub, oldGoldCredit, net: Math.max(0, sub - oldGoldCredit) };
}

function oldGoldCalc(){
  const wt = parseFloat(document.getElementById("ogWt").value)||0;
  const k  = parseInt(document.getElementById("ogK").value,10);
  const ded= parseFloat(document.getElementById("ogD").value)||0;
  const rate = S.bill.lockedRates[k].buy;
  const credit = round2(wt * rate * (1 - ded/100));
  return {wt,k,ded,rate,credit};
}
function previewOld(){
  const c = oldGoldCalc();
  const L = t();
  document.getElementById("ogPreview").innerHTML =
    `${g(c.wt)} g × ${q(c.rate)} <span class="dim">(${L.buy} ${S.lang==="ar"?"عيار "+c.k:c.k+"K"})</span> `
    + `− ${c.ded}% = <b>QAR ${q(c.credit)}</b><br>`
    + `<span class="dim">${esc(t().fineWt)} ${g(fine(c.wt,c.k))} g</span>`;
}
function addOldGold(){
  const c = oldGoldCalc();
  c.method = document.getElementById("ogM").value;
  S.bill.oldGold.push(c);
  closeModal(); renderAll();
}

function recordCddAndFinish(){
  const name = document.getElementById("idName").value.trim();
  const num  = document.getElementById("idNum").value.trim();
  if (!name || !num){ toast(t().idNumber); return; }
  CDD.unshift({
    cust: S.bill.customer || "walkin",
    custName: name,
    idType: document.getElementById("idType").value,
    num, expiry: document.getElementById("idExp").value,
    by:"Counter 2", date:"2026-08-31"
  });
  ALERTS.unshift({ id:"a"+Date.now(), type:"highvalue", cust:S.bill.customer||"", amount:S.bill.tender.cash, date:"2026-08-31", status:"cleared" });
  closeModal();
  finishSale(true);
}
function finishSale(withCdd){
  S.bill.lines.forEach(tag=>{ const it=STOCK.find(s=>s.tag===tag); if(it) it.status="sold"; });
  S.bill.oldGold.forEach((o,i)=>{
    STOCK.push({ tag:"SC-"+String(9200+i+STOCK.length), en:"Scrap lot", ar:"دفعة كسر",
      k:o.k, gross:o.wt, stone:0, branch:S.branch, mk:"g", mkv:0, stoneVal:0, status:"scrap" });
  });
  METAL[S.branch].scrap += S.bill.oldGold.reduce((a,o)=>a+fine(o.wt,o.k),0);
  clearBill();
  toast(withCdd ? t().saleDoneAml : t().saleDone);
}

function moveStock(tag, to){
  if(!to) return;
  const it = STOCK.find(s=>s.tag===tag); if(!it) return;
  const f = fine(netOf(it), it.k);
  METAL[it.branch].owned -= f; METAL[to].owned += f;
  it.branch = to;
  renderAll();
  toast(t().transferred + " → " + branchName(to));
}

  const cddRows = CDD.map(c=>`
    <tr>
      <td class="mono tiny">${esc(c.date)}</td>
      <td>${esc(c.custName || custName(c.cust))}</td>
      <td>${esc({qid:L.qid,passport:L.passport,cr:L.cr}[c.idType]||c.idType)}</td>
      <td class="mono tiny">${esc(c.num)}</td>
      <td class="mono tiny">${esc(c.expiry)}</td>
      <td class="tiny dim">${esc(c.by)}</td>
    </tr>`).join("");

  return `
  <div class="vhead">
    <h2>${esc(L.v_comp_h)}</h2>
    <p>${esc(L.v_comp_p)}</p>
  </div>

  <div class="grid3">
    <div class="panel"><div class="pbody"><div class="metric">
      <div class="lab">${esc(L.cddRecords)}</div><div class="val">${q0(CDD.length)}</div>
      <div class="sub">QAR ${q0(AML_CASH_THRESHOLD)} ${S.lang==="ar"?"حد الاستحقاق":"trigger"}</div></div></div></div>
    <div class="panel"><div class="pbody"><div class="metric">
      <div class="lab">${esc(L.alerts)}</div><div class="val ${openN?"neg":"pos"}">${q0(openN)}</div>
      <div class="sub">${esc(L.open)}</div></div></div></div>
    <div class="panel"><div class="pbody"><div class="metric">
      <div class="lab">${esc(L.retention)}</div><div class="val">10</div>
      <div class="sub">${esc(L.retentionSub)}</div></div></div></div>
  </div>

  <div class="panel">
    <h3>${esc(L.alerts)}</h3>
    <div class="pbody" style="padding:0;overflow-x:auto">
      <table><thead><tr>
        <th>${esc(L.date)}</th><th>${esc(L.alerts)}</th><th>${esc(L.customerCol)}</th>
        <th class="r">${esc(L.amountCol)}</th><th class="r">${esc(L.statusCol)}</th><th></th>
      </tr></thead><tbody>${alertRows}</tbody></table>
    </div>
  </div>

  <div class="panel">
    <h3>${esc(L.cddRecords)}</h3>
    <div class="pbody" style="padding:0;overflow-x:auto">
      <table><thead><tr>
        <th>${esc(L.date)}</th><th>${esc(L.customerCol)}</th><th>${esc(L.idType)}</th>
        <th>${esc(L.idNumber)}</th><th>${esc(L.expiry)}</th><th>${esc(L.recordedBy)}</th>
      </tr></thead><tbody>${cddRows}</tbody></table>
    </div>
  </div>`;
}
function escalate(id){
  const a = ALERTS.find(x=>x.id===id); if(!a) return;
  a.status = "cleared";
  renderAll(); toast(t().escalated);
}

/* ---------------- render ---------------- */
function renderView(){
  const L = t();
  const host = document.getElementById("view");
  const picker = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span class="tiny dim">${esc(L.branch)}</span>
      <select onchange="S.branch=this.value;syncUrl();renderAll()" style="padding:5px 9px;border:1px solid var(--rule);background:#fff">
        ${BRANCHES.map(b=>`<option value="${b.id}" ${S.branch===b.id?"selected":""}>${esc(nameOf(b))}</option>`).join("")}
      </select>
    </div>`;
  const body =
      S.view==="counter"    ? viewCounter()
    : S.view==="stock"      ? viewStock()
    : S.view==="metal"      ? viewMetal()
    : S.view==="compliance" ? viewCompliance()
    : viewBoard();
  host.innerHTML = (S.view==="counter"||S.view==="stock" ? picker : "") + body;

  if (_focusKey){
    const el = host.querySelector('[data-fk="'+_focusKey+'"]');
    if (el){ el.focus(); const v=el.value; el.value=""; el.value=v; }
    _focusKey = null;
  }
}
function renderAll(){ renderNav(); renderBoard(false); renderView(); }

/* ---------------- boot ---------------- */
(function(){
  const p = new URLSearchParams(location.search);
  if (p.get("lang")==="ar") S.lang="ar";
  if (["board","counter","stock","metal","compliance"].includes(p.get("view"))) S.view = p.get("view");
  if (BRANCHES.some(b=>b.id===p.get("branch"))) S.branch = p.get("branch");
  setLang(S.lang);
})();
</script>
</body>
</html>
